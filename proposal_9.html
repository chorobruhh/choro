<!DOCTYPE html>
<html lang="en" class="locked">
<head>
<meta charset="UTF-8">
<title>Forever</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root{
    --gold:#e8c178;
    --lav:#b7a4ff;
    --ink:#f3efe6;
    --night:#0a0c16;
    --night2:#11132280;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%;
    background:var(--night);
    font-family:'Helvetica Neue', Arial, sans-serif;
    cursor:none;
  }
  html.locked, html.locked body{ height:100%; overflow:hidden; }
  html.unlocked{ overflow-y:scroll; -webkit-overflow-scrolling:touch; }
  html.touch, html.touch body{ cursor:auto; }
  html.touch *{ cursor:auto !important; }
  html.touch #cursor, html.touch #cursor-ring{ display:none; }
  ::-webkit-scrollbar{ display:none; }

  #canvas-wrap{ position:fixed; inset:0; z-index:1; }
  canvas{ display:block; }
  #scroll-spacer{ position:relative; width:100%; z-index:0; }

  /* ---------------- intro ---------------- */
  #intro{
    position:fixed; inset:0; z-index:60; background:var(--night);
    display:flex; align-items:center; justify-content:center;
    transition:opacity 1.8s ease;
  }
  #intro.hide{ opacity:0; pointer-events:none; }
  #intro-inner{ text-align:center; }
  #intro-eyebrow{
    font-size:11px; letter-spacing:0.45em; text-transform:uppercase;
    color:var(--gold); opacity:0.65; margin-bottom:22px;
  }
  #intro-title{
    font-family:'Georgia', serif; font-style:italic; font-weight:400;
    font-size:clamp(22px,3.4vw,32px); color:var(--ink); margin:0 0 38px; letter-spacing:0.02em;
  }
  #begin-btn{
    padding:15px 42px; font-size:11px; letter-spacing:0.3em; text-transform:uppercase;
    background:transparent; border:1px solid rgba(232,193,120,0.4); color:var(--gold);
    cursor:none; border-radius:999px; transition:all .5s ease; opacity:0;
    animation:fadein 1.8s ease 0.5s forwards;
  }
  #begin-btn:hover{ background:rgba(232,193,120,0.08); border-color:var(--gold); }
  @keyframes fadein{ to{ opacity:1; } }

  /* ---------------- minimal HUD ---------------- */
  #progress-rail{
    position:fixed; left:32px; top:50%; transform:translateY(-50%); z-index:30;
    width:1px; height:160px; background:rgba(243,239,230,0.12);
    opacity:0; transition:opacity 1.2s ease;
  }
  #progress-rail.show{ opacity:1; }
  #progress-fill{
    position:absolute; left:0; top:0; width:100%; height:0%;
    background:linear-gradient(var(--gold), var(--lav));
  }

  #scroll-hint{
    position:fixed; left:0; right:0; bottom:30px; z-index:30; text-align:center;
    color:var(--ink); opacity:0; transition:opacity 1s ease;
    font-size:10px; letter-spacing:0.35em; text-transform:uppercase;
    pointer-events:none;
  }
  #scroll-hint.show{ opacity:0.45; }
  #scroll-hint .line{
    width:1px; height:26px; margin:0 auto 10px; background:linear-gradient(var(--gold), transparent);
    animation:hint-pulse 2.6s ease-in-out infinite;
  }
  @keyframes hint-pulse{ 0%,100%{opacity:0.2;} 50%{opacity:1;} }

  #section-label{
    position:fixed; left:32px; bottom:36px; z-index:30; color:var(--ink);
    opacity:0; transition:opacity 1s ease; pointer-events:none;
  }
  #section-label.show{ opacity:0.55; }
  #section-label .name{ font-family:'Georgia',serif; font-style:italic; font-size:14px; letter-spacing:0.04em; }

  #music-toggle{
    position:fixed; right:28px; bottom:28px; z-index:50;
    width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(243,239,230,0.25); background:rgba(10,12,22,0.4);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); cursor:none; opacity:0; transition:opacity 1s ease, border-color .3s ease;
  }
  #music-toggle.show{ opacity:0.85; }
  #music-toggle:hover{ border-color:var(--gold); }
  #music-toggle svg{ width:15px; height:15px; }

  /* ---------------- caption card ---------------- */
  .caption-card{
    position:fixed; left:50%; bottom:14%; transform:translate(-50%,12px);
    z-index:25; text-align:center; pointer-events:none;
    opacity:0; transition:opacity 1.1s ease, transform 1.1s ease;
    max-width:340px;
  }
  .caption-card.show{ opacity:1; transform:translate(-50%,0); }
  .caption-card .quote{
    font-family:'Georgia',serif; font-style:italic; color:var(--ink);
    font-size:15px; line-height:1.6; letter-spacing:0.01em;
  }
  .caption-card .meta{
    margin-top:10px; font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); opacity:0.7;
  }

  /* ---------------- finale ---------------- */
  #finale-text{
    position:fixed; left:0; right:0; top:30%; z-index:30; text-align:center;
    opacity:0; transition:opacity 1.8s ease; pointer-events:none;
  }
  #finale-text.show{ opacity:1; }
  #finale-text h1{
    font-family:'Georgia',serif; font-weight:400; font-style:italic;
    font-size:clamp(24px,4vw,40px); color:var(--ink); margin:0;
    text-shadow:0 0 30px rgba(232,193,120,0.35);
  }

  #btn-stage{
    position:fixed; left:0; right:0; bottom:14%; z-index:35;
    display:flex; gap:26px; align-items:center; justify-content:center;
    opacity:0; transition:opacity 1.6s ease 0.3s; pointer-events:none;
  }
  #btn-stage.show{ opacity:1; pointer-events:auto; }
  .glass-btn{
    padding:14px 34px; font-size:13px; letter-spacing:0.1em;
    background:rgba(243,239,230,0.06); backdrop-filter:blur(8px);
    border:1px solid rgba(243,239,230,0.28); border-radius:999px;
    color:var(--ink); cursor:none; font-family:'Helvetica Neue',sans-serif;
    transition:transform .35s ease, background .35s ease, border-color .35s ease;
  }
  #yes-btn:hover{ background:rgba(232,193,120,0.16); border-color:var(--gold); transform:scale(1.04); }
  #no-btn{ position:relative; }
  #no-btn:hover{ background:rgba(243,239,230,0.1); }

  #final-msg{
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 2s ease 0.3s;
  }
  #final-msg.show{ opacity:1; }
  #final-msg h1{
    font-family:'Georgia',serif; font-weight:400; font-style:italic;
    font-size:clamp(22px,3.6vw,38px); color:var(--gold); text-align:center; padding:0 24px;
    text-shadow:0 0 36px rgba(232,193,120,0.45);
  }

  /* ---------------- cursor ---------------- */
  #cursor{
    position:fixed; top:0; left:0; width:7px; height:7px; border-radius:50%;
    background:var(--gold); pointer-events:none; z-index:9999; transform:translate(-50%,-50%);
    box-shadow:0 0 10px 2px rgba(232,193,120,0.5);
  }
  #cursor-ring{
    position:fixed; top:0; left:0; width:30px; height:30px; border-radius:50%;
    border:1px solid rgba(232,193,120,0.4); pointer-events:none; z-index:9998;
    transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease, opacity .25s ease;
  }

  #skip{
    position:fixed; top:28px; right:30px; z-index:50; color:var(--ink);
    font-size:10px; letter-spacing:0.3em; text-transform:uppercase; cursor:none;
    opacity:0; transition:opacity 1s ease;
  }
  #skip.show{ opacity:0.4; }
  #skip:hover{ opacity:0.8; }

  /* ---------------- mobile tuning ---------------- */
  @media (max-width: 760px){
    #intro-title{ font-size:19px; padding:0 28px; line-height:1.45; }
    #progress-rail{ left:18px; height:120px; }
    #section-label{ left:18px; bottom:calc(22px + env(safe-area-inset-bottom,0px)); }
    #section-label .name{ font-size:12px; }
    #scroll-hint{ bottom:calc(22px + env(safe-area-inset-bottom,0px)); font-size:9px; }
    #music-toggle{ right:16px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); width:40px; height:40px; }
    #skip{ top:calc(18px + env(safe-area-inset-top,0px)); right:18px; font-size:9px; }
    .caption-card{ bottom:18%; max-width:84vw; }
    .caption-card .quote{ font-size:14px; }
    #finale-text h1{ font-size:22px; padding:0 18px; }
    #btn-stage{ bottom:calc(10% + env(safe-area-inset-bottom,0px)); gap:16px; flex-wrap:wrap; padding:0 16px; }
    .glass-btn{ padding:14px 26px; font-size:13px; }
    #final-msg h1{ font-size:21px; padding:0 22px; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<div id="intro">
  <div id="intro-inner">
    <div id="intro-eyebrow">A Journey, Quietly Told</div>
    <div id="intro-title">Close your eyes for a moment,<br>then open them here.</div>
    <button id="begin-btn">Begin</button>
  </div>
</div>

<div id="skip">Skip ahead</div>
<div id="progress-rail"><div id="progress-fill"></div></div>
<div id="scroll-hint"><div class="line"></div>Scroll</div>
<div id="section-label"><div class="name">The Beginning</div></div>
<div id="music-toggle" aria-label="toggle music">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
    <path id="music-icon" d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm11-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
  </svg>
</div>

<div class="caption-card" id="caption-card">
  <div class="quote" id="caption-quote">&nbsp;</div>
  <div class="meta" id="caption-meta">&nbsp;</div>
</div>

<div id="canvas-wrap"></div>
<div id="scroll-spacer"></div>

<div id="finale-text"><h1>Will you be mine, forever?</h1></div>
<div id="btn-stage">
  <button class="glass-btn" id="yes-btn">Yes, always</button>
  <button class="glass-btn" id="no-btn">Not yet</button>
</div>
<div id="final-msg"><h1>I choose you —<br>today, tomorrow, forever.</h1></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* =========================================================================
   DEVICE DETECTION — tune quality + UI for phones automatically
   ========================================================================= */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer:coarse)').matches;
const isMobile = isTouch || window.innerWidth < 820;
if(isTouch) document.documentElement.classList.add('touch');

/* =========================================================================
   PALETTE
   ========================================================================= */
const PALETTE = {
  night:   new THREE.Color(0x0a0c16),
  horizon: new THREE.Color(0x2b2444),
  gold:    new THREE.Color(0xe8c178),
  lav:     new THREE.Color(0xb7a4ff),
  ground:  new THREE.Color(0x141226),
};

/* =========================================================================
   RENDERER / SCENE / CAMERA
   ========================================================================= */
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias:!isMobile, powerPreference:'high-performance', alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(PALETTE.night.getHex(), 0.016);
renderer.setClearColor(scene.fog.color);

const camera = new THREE.PerspectiveCamera(isMobile ? 62 : 50, window.innerWidth/window.innerHeight, 0.1, 2000);

let lastW = window.innerWidth, lastH = window.innerHeight;
window.addEventListener('resize', ()=>{
  const w = window.innerWidth, h = window.innerHeight;
  // ignore small height-only changes from mobile browser toolbars showing/hiding
  if(isMobile && Math.abs(w-lastW) < 2 && Math.abs(h-lastH) < 120) return;
  lastW = w; lastH = h;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

/* =========================================================================
   LIGHTING — one warm "moon" key light + soft ambient fill, nothing else
   ========================================================================= */
const hemi = new THREE.HemisphereLight(0x6c7bb0, 0x0e0c18, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe2b0, 1.1);
key.position.set(-30, 40, 20);
scene.add(key);
const fill = new THREE.AmbientLight(0x2a2550, 0.4);
scene.add(fill);

/* =========================================================================
   SKY DOME — gradient shader, soft stars, two drifting cloud planes
   ========================================================================= */
const skyVert = `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const skyFrag = `
  varying vec3 vPos;
  uniform vec3 uTop;
  uniform vec3 uHorizon;
  void main(){
    float h = normalize(vPos).y * 0.5 + 0.5;
    vec3 col = mix(uHorizon, uTop, pow(h,0.55));
    gl_FragColor = vec4(col,1.0);
  }
`;
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 32, 32),
  new THREE.ShaderMaterial({
    vertexShader:skyVert, fragmentShader:skyFrag,
    uniforms:{ uTop:{value:PALETTE.night}, uHorizon:{value:PALETTE.horizon} },
    side:THREE.BackSide, depthWrite:false,
  })
);
scene.add(sky);

// stars — sparse, twinkling, far away
const starCount = isMobile ? 420 : 900;
const starPos = new Float32Array(starCount*3);
const starPhase = new Float32Array(starCount);
for(let i=0;i<starCount;i++){
  const r = 600 + Math.random()*250;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(Math.random()*0.7); // bias upward, keep horizon clear
  starPos[i*3]   = r*Math.sin(phi)*Math.cos(theta);
  starPos[i*3+1] = r*Math.cos(phi)*0.6 + 80;
  starPos[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
  starPhase[i] = Math.random()*Math.PI*2;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({ color:0xfdf6e3, size:1.1, transparent:true, opacity:0.65, sizeAttenuation:true, depthWrite:false });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// soft clouds: two large translucent noise planes, drifting very slowly
const cloudFrag = `
  varying vec2 vUv;
  uniform float uTime;
  float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }
  float noise(vec2 p){
    vec2 i=floor(p), f=fract(p);
    float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
    vec2 u=f*f*(3.0-2.0*f);
    return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
  }
  void main(){
    vec2 uv = vUv*vec2(3.0,1.6) + vec2(uTime*0.004, 0.0);
    float n = noise(uv)*0.6 + noise(uv*2.0)*0.3;
    float edge = smoothstep(0.0,0.25,vUv.y) * smoothstep(1.0,0.7,vUv.y);
    float alpha = smoothstep(0.4,0.75,n) * edge * 0.22;
    gl_FragColor = vec4(vec3(0.85,0.84,0.95), alpha);
  }
`;
const cloudVert = `varying vec2 vUv; void main(){ vUv=uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const cloudLayers = [];
for(let i=0;i<2;i++){
  const mat = new THREE.ShaderMaterial({
    vertexShader:cloudVert, fragmentShader:cloudFrag,
    uniforms:{ uTime:{value:0} }, transparent:true, depthWrite:false, side:THREE.DoubleSide,
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(700,160), mat);
  plane.position.set(0, 70+i*40, -150 - i*120);
  plane.rotation.x = -0.02;
  scene.add(plane);
  cloudLayers.push(mat);
}

/* =========================================================================
   GROUND — one continuous gently-rolling terrain strip along the whole path
   ========================================================================= */
const WORLD_LENGTH = 420;
const groundGeo = new THREE.PlaneGeometry(140, WORLD_LENGTH+80, isMobile ? 26 : 48, isMobile ? 80 : 140);
groundGeo.rotateX(-Math.PI/2);
{
  const posAttr = groundGeo.attributes.position;
  const colorArr = new Float32Array(posAttr.count*3);
  const cLow = new THREE.Color(0x0d0c1a);
  const cHigh = new THREE.Color(0x232049);
  for(let i=0;i<posAttr.count;i++){
    const x = posAttr.getX(i);
    const z = posAttr.getZ(i);
    const h = Math.sin(z*0.025)*2.2 + Math.sin(x*0.05 + z*0.015)*1.4 + Math.sin(x*0.11)*0.5;
    posAttr.setY(i, h - 6);
    const t = THREE.MathUtils.clamp((h+3)/6, 0, 1);
    const c = cLow.clone().lerp(cHigh, t);
    colorArr[i*3]=c.r; colorArr[i*3+1]=c.g; colorArr[i*3+2]=c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(colorArr,3));
  groundGeo.computeVertexNormals();
}
const groundMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:1, metalness:0, flatShading:false });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.z = -WORLD_LENGTH/2 + 20;
scene.add(ground);

// a still, reflective lake patch roughly mid-journey for quiet visual variety
const waterFrag = `
  varying vec2 vUv;
  uniform float uTime;
  void main(){
    float ripple = sin(vUv.x*30.0 + uTime*0.5)*0.015 + sin(vUv.y*22.0 - uTime*0.35)*0.015;
    vec3 deep = vec3(0.04,0.05,0.10);
    vec3 light = vec3(0.20,0.22,0.34);
    vec3 col = mix(deep, light, 0.5+ripple*5.0);
    float edge = smoothstep(0.0,0.18,vUv.x)*smoothstep(1.0,0.82,vUv.x)*smoothstep(0.0,0.18,vUv.y)*smoothstep(1.0,0.82,vUv.y);
    gl_FragColor = vec4(col, 0.85*edge + 0.15);
  }
`;
const waterVert = `varying vec2 vUv; void main(){ vUv=uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const waterMat = new THREE.ShaderMaterial({ vertexShader:waterVert, fragmentShader:waterFrag, uniforms:{uTime:{value:0}}, transparent:true });
const water = new THREE.Mesh(new THREE.PlaneGeometry(60,90), waterMat);
water.rotation.x = -Math.PI/2;
water.position.set(0, -7.4, -190);
scene.add(water);

/* =========================================================================
   PARTICLES — one gentle, sparse field of drifting motes (no clutter)
   ========================================================================= */
const moteCount = isMobile ? 110 : 260;
const motePos = new Float32Array(moteCount*3);
const moteSeed = new Float32Array(moteCount);
for(let i=0;i<moteCount;i++){
  motePos[i*3]   = (Math.random()-0.5)*90;
  motePos[i*3+1] = Math.random()*22 - 4;
  motePos[i*3+2] = -Math.random()*WORLD_LENGTH;
  moteSeed[i] = Math.random()*1000;
}
const moteGeo = new THREE.BufferGeometry();
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos,3));
const moteMat = new THREE.PointsMaterial({
  color:0xf3e2b0, size:0.22, transparent:true, opacity:0.55,
  blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true,
});
const motes = new THREE.Points(moteGeo, moteMat);
scene.add(motes);

/* =========================================================================
   CRYSTAL HEART — single signature object, lives at journey's end
   ========================================================================= */
function makeHeartShape(){
  const s = new THREE.Shape();
  s.moveTo(0,0);
  s.bezierCurveTo(0,-1.4,-2.6,-1.4,-2.6,0.6);
  s.bezierCurveTo(-2.6,2.4,0,3.4,0,4.6);
  s.bezierCurveTo(0,3.4,2.6,2.4,2.6,0.6);
  s.bezierCurveTo(2.6,-1.4,0,-1.4,0,0);
  return s;
}
const heartGeo = new THREE.ExtrudeGeometry(makeHeartShape(), { depth:1.2, bevelEnabled:true, bevelThickness:0.5, bevelSize:0.4, bevelSegments:20, curveSegments:64 });
heartGeo.center(); heartGeo.scale(1.5,1.5,1.5); heartGeo.rotateZ(Math.PI);
heartGeo.computeVertexNormals();

const heartVert = `
  varying vec3 vNormal; varying vec3 vViewDir;
  uniform float uTime; uniform float uPulse;
  void main(){
    vec3 p = position * (1.0 + 0.025*sin(uTime*1.6 + position.y*2.4) * uPulse);
    vNormal = normalize(normalMatrix * normal);
    vec4 mv = modelViewMatrix * vec4(p,1.0);
    vViewDir = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv;
  }
`;
const heartFrag = `
  varying vec3 vNormal; varying vec3 vViewDir;
  uniform float uTime;
  void main(){
    vec3 N = normalize(vNormal);
    vec3 V = normalize(vViewDir);
    vec3 L = normalize(vec3(0.4,0.7,0.6));
    float diff = max(dot(N,L), 0.0);
    vec3 H = normalize(L+V);
    float spec = pow(max(dot(N,H),0.0), 50.0);
    float fres = pow(1.0 - max(dot(N,V),0.0), 2.4);
    vec3 base = mix(vec3(0.55,0.18,0.12), vec3(0.92,0.55,0.32), diff*0.8);
    float pulse = 0.5 + 0.5*sin(uTime*1.3);
    vec3 col = base*(1.0+0.35*pulse) + vec3(1.0,0.92,0.8)*spec*1.1 + vec3(0.95,0.75,0.55)*fres*0.8;
    gl_FragColor = vec4(col, 0.85 + fres*0.3);
  }
`;
const heartMat = new THREE.ShaderMaterial({ vertexShader:heartVert, fragmentShader:heartFrag, uniforms:{uTime:{value:0},uPulse:{value:1}}, transparent:true, side:THREE.DoubleSide });
const heartMesh = new THREE.Mesh(heartGeo, heartMat);
heartMesh.position.set(0, 4, -WORLD_LENGTH-6);
heartMesh.scale.set(0.001,0.001,0.001);
scene.add(heartMesh);

const glowMat = new THREE.MeshBasicMaterial({ color:0xf0c896, transparent:true, opacity:0.12, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false });
const glowMesh = new THREE.Mesh(heartGeo.clone(), glowMat);
glowMesh.scale.set(1.2,1.2,1.2);
heartMesh.add(glowMesh);

const heartLight = new THREE.PointLight(0xf0b878, 0, 50);
scene.add(heartLight);

/* =========================================================================
   PHOTO FRAMES — premium glass frames, evenly spaced, never overlapping
   Real photos, embedded as base64 so the file stays a single portable HTML.
   ========================================================================= */
const textureLoader = new THREE.TextureLoader();

const memories = [
  { photo:1, ratio:1000/562, z:-46,  side:-1, caption:'The first time I saw you smile.', meta:'Memory One' },
  { photo:2, ratio:1000/562, z:-95,  side:1,  caption:'A quiet afternoon, just us two.', meta:'Memory Two' },
  { photo:3, ratio:1000/562, z:-150, side:-1, caption:'You laughed, and I knew.', meta:'Memory Three' },
  { photo:4, ratio:750/1000, z:-240, side:1,  caption:'Every road led back to you.', meta:'Memory Four' },
  { photo:5, ratio:562/1000, z:-300, side:-1, caption:'Home was never a place. It was you.', meta:'Memory Five' },
  { photo:6, ratio:562/1000, z:-355, side:1,  caption:'And still, I choose you — again.', meta:'Memory Six' },
];

const frameGroups = [];
memories.forEach((m,i)=>{
  const group = new THREE.Group();

  // size the photo plane to its own aspect ratio inside a consistent bounding box
  let frameW, frameH;
  if(m.ratio >= 1){ frameW = 3.8; frameH = 3.8/m.ratio; }
  else { frameH = 4.5; frameW = 4.5*m.ratio; }

  const tex = textureLoader.load(MEMORY_PHOTOS[m.photo]);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 4;
  const photoMat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.4, metalness:0.04 });
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(frameW, frameH), photoMat);
  group.add(photo);

  const border = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(frameW+0.18, frameH+0.18)),
    new THREE.LineBasicMaterial({ color:0xe8c178, transparent:true, opacity:0.55 })
  );
  border.position.z = 0.01;
  group.add(border);

  const glassMat = new THREE.MeshPhysicalMaterial({
    color:0xffffff, transparent:true, opacity:0.06, roughness:0.05, metalness:0,
    transmission:0.9, thickness:0.2, depthWrite:false,
  });
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(frameW+0.36, frameH+0.36), glassMat);
  glass.position.z = 0.05;
  group.add(glass);

  group.position.set(m.side * 13, 2.5 + Math.sin(i*1.3)*0.6, m.z);
  group.rotation.y = -m.side * 0.42;
  group.userData = { baseY:group.position.y, baseRotY:group.rotation.y, seed:i*7.3, m };
  scene.add(group);
  frameGroups.push(group);
});

/* =========================================================================
   CAMERA PATH — single smooth curve; scroll position maps directly to
   position along it, so reversing scroll naturally reverses everything.
   ========================================================================= */
const pathPts = [];
for(let i=0;i<=40;i++){
  const t = i/40;
  const z = -t * WORLD_LENGTH;
  const x = Math.sin(t*Math.PI*2.1) * 5.5;
  const y = 1.5 + Math.sin(t*Math.PI*1.6) * 1.6 + (t>0.93 ? (t-0.93)*46 : 0);
  pathPts.push(new THREE.Vector3(x,y,z));
}
const cameraCurve = new THREE.CatmullRomCurve3(pathPts);
const lookPts = pathPts.map((p,i)=> pathPts[Math.min(i+2, pathPts.length-1)]);
const lookCurve = new THREE.CatmullRomCurve3(lookPts);

/* =========================================================================
   AUDIO — soft ambient pad, toggleable, no jarring sounds
   ========================================================================= */
let audioCtx, masterGain, padGain, musicOn = false;
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0; masterGain.connect(audioCtx.destination);
  padGain = audioCtx.createGain(); padGain.gain.value = 0.045; padGain.connect(masterGain);
  [196, 246.94, 293.66].forEach((f,i)=>{
    const osc = audioCtx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = f;
    const g = audioCtx.createGain(); g.gain.value = 1/(i+1.6);
    osc.connect(g); g.connect(padGain); osc.start();
  });
  musicOn = true;
  gsap.to(masterGain.gain, { value:0.5, duration:3 });
}
function toggleMusic(){
  if(!audioCtx){ initAudio(); updateMusicIcon(); return; }
  musicOn = !musicOn;
  gsap.to(masterGain.gain, { value: musicOn ? 0.5 : 0, duration:1.2 });
  updateMusicIcon();
}
function updateMusicIcon(){
  document.getElementById('music-toggle').style.opacity = musicOn ? '0.85' : '0.4';
}
function chime(freqs){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  freqs.forEach((f,i)=>{
    const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
    osc.type='sine'; osc.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.12, t+0.06+i*0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+1.6);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+1.7);
  });
}
document.getElementById('music-toggle').addEventListener('click', toggleMusic);

/* =========================================================================
   SCROLL STATE
   ========================================================================= */
const totalScrollPx = window.innerHeight * 11;
document.getElementById('scroll-spacer').style.height = totalScrollPx + 'px';

let journeyEntered = false;
let scrollProgress = 0;
let finaleShown = false;
const tmpV = new THREE.Vector3();
const tmpLook = new THREE.Vector3();

function currentSection(p){
  const z = p*WORLD_LENGTH;
  let idx = 0;
  for(let i=0;i<sections.length;i++){ if(z >= sections[i].z) idx = i; }
  return sections[idx];
}
let lastSectionName = '';
function updateLabel(p){
  const sec = currentSection(p);
  if(sec.name !== lastSectionName){
    lastSectionName = sec.name;
    document.querySelector('#section-label .name').textContent = sec.name;
  }
}

function updateCaptions(p){
  const z = p*WORLD_LENGTH;
  let active = null;
  memories.forEach(m=>{
    const mz = -m.z;
    if(Math.abs(z - mz) < 9) active = m;
  });
  const card = document.getElementById('caption-card');
  if(active){
    document.getElementById('caption-quote').textContent = active.caption;
    document.getElementById('caption-meta').textContent = active.meta;
    card.classList.add('show');
  } else {
    card.classList.remove('show');
  }
}

window.addEventListener('scroll', ()=>{
  if(!journeyEntered) return;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const top = window.scrollY || document.documentElement.scrollTop;
  scrollProgress = Math.min(1, Math.max(0, top/max));
  document.getElementById('progress-fill').style.height = (scrollProgress*100)+'%';
  updateLabel(scrollProgress);
  updateCaptions(scrollProgress);
  if(scrollProgress > 0.992 && !finaleShown) showFinale();
  if(scrollProgress < 0.97 && finaleShown) hideFinale();
}, { passive:true });

function showFinale(){
  finaleShown = true;
  document.getElementById('finale-text').classList.add('show');
  document.getElementById('btn-stage').classList.add('show');
  document.getElementById('scroll-hint').classList.remove('show');
  gsap.to(heartLight, { intensity:2.2, duration:1.5 });
  chime([523.25,659.25,783.99]);
}
function hideFinale(){
  finaleShown = false;
  document.getElementById('finale-text').classList.remove('show');
  document.getElementById('btn-stage').classList.remove('show');
  if(!yesChosen) gsap.to(heartLight, { intensity:0, duration:1 });
}

/* =========================================================================
   INTRO
   ========================================================================= */
const introEl = document.getElementById('intro');
document.getElementById('begin-btn').addEventListener('click', startExperience);

function startExperience(){
  initAudio(); updateMusicIcon();

  camera.position.set(0, 2.2, 10);
  camera.lookAt(0,1.5,0);

  introEl.classList.add('hide');
  setTimeout(()=> introEl.style.display='none', 1900);

  document.documentElement.classList.remove('locked');
  document.documentElement.classList.add('unlocked');
  window.scrollTo(0,1);
  journeyEntered = true;

  document.getElementById('progress-rail').classList.add('show');
  document.getElementById('scroll-hint').classList.add('show');
  document.getElementById('section-label').classList.add('show');
  document.getElementById('music-toggle').classList.add('show');
  document.getElementById('skip').classList.add('show');

  gsap.to(heartMesh.scale, { x:1,y:1,z:1, duration:0.1 });
}

document.getElementById('skip').addEventListener('click', ()=>{
  if(!journeyEntered) return;
  window.scrollTo({ top: document.documentElement.scrollHeight, behavior:'smooth' });
});

/* =========================================================================
   FINALE INTERACTIONS — tasteful, restrained
   ========================================================================= */
const yesBtn = document.getElementById('yes-btn');
const noBtn = document.getElementById('no-btn');
let yesChosen = false;
let noNudges = 0;

noBtn.addEventListener('mouseenter', nudgeNo);
noBtn.addEventListener('click', nudgeNo);

function nudgeNo(e){
  if(e.type==='click') e.preventDefault();
  if(yesChosen) return;
  noNudges++;
  chime([349.2]);
  const range = Math.min(90, window.innerWidth*0.22);
  const dx = (Math.random()-0.5) * range;
  const dy = (Math.random()-0.5) * Math.min(18, window.innerHeight*0.04);
  gsap.to(noBtn, { x:dx, y:dy, duration:0.6, ease:'power3.out' });
  if(noNudges === 3) noBtn.textContent = 'Are you sure?';
  if(noNudges >= 6){
    gsap.to(noBtn, {
      opacity:0, duration:0.5, onComplete:()=>{
        noBtn.textContent = 'Yes, always';
        noBtn.style.x = 0;
        gsap.set(noBtn, { x:0, y:0 });
        gsap.to(noBtn, { opacity:1, duration:0.6 });
        noBtn.removeEventListener('mouseenter', nudgeNo);
        noBtn.onclick = chooseYes;
      }
    });
  }
}

yesBtn.addEventListener('click', chooseYes);

function chooseYes(){
  if(yesChosen) return;
  yesChosen = true;
  chime([523.25,659.25,783.99,1046.5]);

  document.getElementById('finale-text').style.transition = 'opacity 1.2s ease';
  document.getElementById('finale-text').style.opacity = '0';
  document.getElementById('btn-stage').style.transition = 'opacity 1s ease';
  document.getElementById('btn-stage').style.opacity = '0';
  document.getElementById('btn-stage').style.pointerEvents = 'none';

  gsap.to(heartMesh.scale, { x:1.35,y:1.35,z:1.35, duration:1.4, ease:'power2.out' });
  gsap.to(heartLight, { intensity:3.4, duration:1.6 });
  gsap.to(haloMat, { opacity:0.4, duration:1.6 });
  gsap.to(scene.fog, { density:0.01, duration:2.4 });
  gsap.to(key, { intensity:1.6, duration:2.4 });

  setTimeout(()=>{ document.getElementById('final-msg').classList.add('show'); }, 1300);
}

/* =========================================================================
   RENDER LOOP
   ========================================================================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  curX += (mouseX-curX)*0.25; curY += (mouseY-curY)*0.25;
  ringX += (mouseX-ringX)*0.12; ringY += (mouseY-ringY)*0.12;
  cursorEl.style.left = curX+'px'; cursorEl.style.top = curY+'px';
  ringEl.style.left = ringX+'px'; ringEl.style.top = ringY+'px';

  heartMat.uniforms.uTime.value = t;
  waterMat.uniforms.uTime.value = t;
  cloudLayers.forEach(m=> m.uniforms.uTime.value = t);

  // gentle star twinkle
  const sArr = starGeo.attributes.position;
  starMat.opacity = 0.55 + 0.15*Math.sin(t*0.3);

  // soft mote drift
  const mArr = moteGeo.attributes.position.array;
  for(let i=0;i<moteCount;i++){
    mArr[i*3+1] += Math.sin(t*0.3 + moteSeed[i])*0.0015;
    mArr[i*3]   += Math.cos(t*0.2 + moteSeed[i])*0.0012;
  }
  moteGeo.attributes.position.needsUpdate = true;

  // frames: idle float + gentle mouse parallax tilt, always facing the path
  frameGroups.forEach(g=>{
    const d = g.userData;
    g.position.y = d.baseY + Math.sin(t*0.5 + d.seed)*0.18;
    const tiltTarget = d.baseRotY + mouseNormX*0.08;
    g.rotation.y += (tiltTarget - g.rotation.y) * 0.04;
    g.rotation.x += (mouseNormY*0.05 - g.rotation.x) * 0.04;
  });

  // camera path
  if(journeyEntered){
    const p = Math.min(0.999, scrollProgress);
    cameraCurve.getPointAt(p, tmpV);
    lookCurve.getPointAt(Math.min(0.999, p+0.012), tmpLook);

    if(!yesChosen){
      camera.position.lerp(tmpV, 0.18);
      const lookTarget = tmpLook.clone();
      lookTarget.x += mouseNormX*1.2;
      lookTarget.y += -mouseNormY*0.6;
      const m4 = new THREE.Matrix4().lookAt(camera.position, lookTarget, camera.up);
      const q = new THREE.Quaternion().setFromRotationMatrix(m4);
      camera.quaternion.slerp(q, 0.08);
    } else {
      const r = 13, a = t*0.1;
      const orbitTarget = new THREE.Vector3(Math.sin(a)*r, heartMesh.position.y+1.5, heartMesh.position.z+Math.cos(a)*r);
      camera.position.lerp(orbitTarget, 0.03);
      camera.lookAt(heartMesh.position);
    }

    const hue = THREE.MathUtils.lerp(0.0, 1.0, p);
    sky.material.uniforms.uTop.value.copy(PALETTE.night).lerp(new THREE.Color(0x1a1530), p*0.4);
    scene.fog.color.copy(sky.material.uniforms.uTop.value.clone().lerp(PALETTE.horizon, 0.15));
    renderer.setClearColor(scene.fog.color);
  }

  renderer.render(scene, camera);
}
animate();
</script>
